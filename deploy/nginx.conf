server {
    listen 80;
    server_name docker-mirror.fotros.dev;
    return 308 https://docker-mirror.fotros.dev$request_uri;
}

server {
    listen 443 ssl;
    server_name docker-mirror.fotros.dev;
    ssl_certificate /etc/letsencrypt/live/docker-mirror.fotros.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docker-mirror.fotros.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100g;
    client_body_timeout 300s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host docker-mirror.fotros.dev;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Host "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header X-Forwarded-For "";
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_next_upstream off;
        gzip off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
